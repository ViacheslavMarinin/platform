[build]
  publish = "."
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sdk/v1.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Supabase через домен сайта (на случай, если supabase.co недоступен у игрока)
[[redirects]]
  from = "/sb/*"
  to = "https://zykuquspmtmfcaofebxx.supabase.co/:splat"
  status = 200
  force = true

# Пико и сокровища: отдельный сайт на Netlify, показывается по адресу /piko/
# Ссылки на игру всегда со слешем на конце: /piko/ (Netlify не различает /piko и /piko/,
# поэтому правило «добавить слеш» тут зацикливается)
[[redirects]]
  from = "/piko/*"
  to = "https://brilliant-eclair-mar.netlify.app/:splat"
  status = 200
  force = true

# Хомячья мозаика: отдельный сайт на Netlify (репозиторий hamster-mosaic), показывается по адресу /hamsters/
[[redirects]]
  from = "/hamsters/*"
  to = "https://hamster33.netlify.app/:splat"
  status = 200
  force = true

# Служебные файлы репозитория не отдаём наружу
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
