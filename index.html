<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой маленький мир</title>
<meta name="description" content="Маленькие игры с общим входом и уточками">
<meta name="theme-color" content="#bfe8f2">
<link rel="icon" href="/img/duck.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/duck-180.png">
<style>
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url(/fonts/nunito-cyrillic-600.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(/fonts/nunito-cyrillic-800.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url(/fonts/nunito-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(/fonts/nunito-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --water-top:#d9f3f8; --water-bot:#9fd9e8;
  --ink:#1f3a4a; --ink-soft:#4d6b7a;
  --card:#fffdf6; --card-edge:#f0e6c8;
  --duck:#ffd23f; --duck-deep:#f2b705; --cap:#e63946;
  --piko:#4b2fb0;
  --radius:22px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh; min-height:100dvh;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:600;
  color:var(--ink);
  background:linear-gradient(180deg,var(--water-top) 0%,var(--water-bot) 100%) fixed;
  background-color:var(--water-bot);
  overflow-x:hidden;
}
/* пузырьки */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{
  position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff 0 18%,rgba(255,255,255,.35) 19% 60%,rgba(255,255,255,.08) 61%);
  border:1px solid rgba(255,255,255,.7);
  animation:rise linear infinite;
}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx,0))}}
@media (prefers-reduced-motion:reduce){.bubbles span{animation:none;display:none}}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}

header{display:flex;align-items:center;gap:14px;padding:8px 0 26px}
.logo{width:64px;height:64px;flex:none;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
h1{font-weight:800;font-size:clamp(26px,6.4vw,38px);line-height:1.05;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:15px;margin-top:4px}

h2{font-weight:800;font-size:20px;margin:0 0 12px 4px}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.game{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--card);border-radius:var(--radius);
  box-shadow:0 2px 0 var(--card-edge),0 10px 24px -12px rgba(31,58,74,.45);
  overflow:hidden;transition:transform .15s ease,box-shadow .15s ease;
}
.game:active{transform:scale(.98)}
@media (hover:hover){.game:hover{transform:translateY(-3px);box-shadow:0 2px 0 var(--card-edge),0 16px 30px -14px rgba(31,58,74,.55)}}
.game .art{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.game .art img{width:100%;height:100%;object-fit:cover;display:block}
.game.piko .art{background:var(--piko)}
.game .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.game .name{font-weight:800;font-size:19px}
.game .about{color:var(--ink-soft);font-size:14px;line-height:1.35;flex:1}
.play{
  margin-top:10px;align-self:flex-start;
  font-weight:800;font-size:15px;color:#fff;background:var(--piko);
  padding:9px 18px;border-radius:999px;
}
.game.soon{background:rgba(255,253,246,.55);box-shadow:none;border:2px dashed rgba(31,58,74,.22);cursor:default}
.game.soon .art{color:var(--ink-soft);font-size:44px;opacity:.6}
@media (max-width:480px){.game.soon{flex-direction:row;align-items:center}.game.soon .art{aspect-ratio:auto;width:72px;font-size:32px}.game.soon .body{padding-left:0}}
.game.soon .name{color:var(--ink-soft)}

.note{
  margin-top:26px;display:flex;gap:12px;align-items:center;
  background:rgba(255,253,246,.7);border-radius:var(--radius);padding:14px 16px;
  font-size:14px;color:var(--ink-soft);line-height:1.4;
}
.note img{width:36px;height:36px;flex:none}
footer{margin-top:28px;text-align:center;font-size:13px;color:var(--ink-soft);opacity:.8}
</style>
</head>
<body>
<div class="bubbles" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <img class="logo" src="/img/duck.svg" alt="">
    <div>
      <h1>Мой маленький мир</h1>
      <p class="sub">Маленькие игры, один вход на все</p>
    </div>
  </header>

  <main>
    <h2>Игры</h2>
    <div class="games">
      <a class="game piko" href="/piko/">
        <div class="art"><img src="/img/piko.webp" alt="Дракончик Пико" width="384" height="384"></div>
        <div class="body">
          <div class="name">Пико и сокровища</div>
          <div class="about">Три в ряд с дракончиком Пико: сотни уровней, препятствия и сокровища.</div>
          <span class="play">Играть</span>
        </div>
      </a>
      <div class="game soon" aria-disabled="true">
        <div class="art">✦</div>
        <div class="body">
          <div class="name">Скоро</div>
          <div class="about">Здесь появятся новые игры.</div>
        </div>
      </div>
    </div>

    <div class="note">
      <img src="/img/duck.svg" alt="">
      <span>Скоро здесь будут профиль и уточки — общая награда за все игры.</span>
    </div>
  </main>

  <footer>mlymir.ru</footer>
</div>

<script>
// Пузырьки в фоне: немного, лёгкие
(function(){
  const box = document.querySelector('.bubbles');
  const n = window.innerWidth < 600 ? 10 : 16;
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    const size = 8 + Math.random() * 26;
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (12 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 26) + 's';
    s.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px');
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
